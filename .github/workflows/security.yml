name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, offset from the top of the hour so it does not queue with everything else.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          # build-mode none keeps this off the Android SDK/Gradle critical path;
          # CodeQL reads Kotlin/Java sources directly.
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: 1.26.2
          cache-dependency-path: schism-backend/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Copyleft licences would force us to publish the app source; block them here
          # rather than at review time.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0

  gradle-dependency-submission:
    name: Gradle dependency submission
    # Only from the trusted default branch: this is the one job holding contents: write.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: schism-android
