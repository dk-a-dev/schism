name: Release

# Tag-driven release. Pushing v1.3.4 builds, verifies, publishes the APK to GitHub Releases, and
# uploads the AAB to Play's internal track.
#
# Nothing here decides what the version IS — build.gradle.kts does. The tag is checked against it
# and the job fails on a mismatch, so a release can never be labelled one version and contain
# another. Artifact filenames are derived the same way; they used to be hardcoded `schism-v1.3.0`,
# which silently mislabelled every release after 1.3.0.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.2
          cache-dependency-path: schism-backend/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6

      # The build file is the single source of truth for the version. Read it, then refuse to
      # continue if the tag disagrees.
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=schism-android/app/build.gradle.kts
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$gradle_file")
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$gradle_file")
          [[ -n $name && -n $code ]] || { echo "cannot read version from $gradle_file" >&2; exit 1; }
          tag="${GITHUB_REF_TYPE:-}" && tag="${GITHUB_REF_NAME:-}"
          if [[ ${GITHUB_REF_TYPE:-} == tag ]]; then
            if [[ "$tag" != "v$name" ]]; then
              echo "::error::tag $tag does not match versionName $name in $gradle_file." >&2
              echo "::error::Bump the build file or retag; a release must not be labelled a version it does not contain." >&2
              exit 1
            fi
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=${tag:-v$name}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name ($code)"

      - name: Test backend
        working-directory: schism-backend
        run: go test ./... -count=1

      - name: Validate store copy and release tooling
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/store -p 'test_*.py'
          python3 tools/store/validate_copy.py store/play
          tools/release/test_release_tools.sh
          # Release notes for the versionCode being shipped must exist; Play needs them and a
          # missing file is easier to catch here than in the Console.
          notes="store/play/en-US/release-notes/${{ steps.version.outputs.code }}.txt"
          test -s "$notes" || { echo "::error::missing $notes"; exit 1; }

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: schism-android
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          key_file="$RUNNER_TEMP/schism-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          {
            echo "storeFile=$key_file"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build Android release
        working-directory: schism-android
        # Single default variant: no product flavors, no feature modules.
        run: ./gradlew test :app:lintRelease :app:bundleRelease :app:assembleRelease

      - name: Verify artifacts
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.RELEASE_SIGNER_SHA256 }}
        run: |
          tools/release/verify_android_artifacts.sh \
            schism-android/app/build/outputs/bundle/release/app-release.aab \
            schism-android/app/build/outputs/apk/release/app-release.apk

      - name: Stage artifacts and checksums
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.RELEASE_SIGNER_SHA256 }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # The APK is what a person installs, so it is what ships to GitHub Releases with its
          # checksums. The AAB goes to Play and is uploaded separately; publishing it to GitHub
          # would just invite someone to try installing a file Android cannot install.
          mkdir -p dist/github dist/play
          cp schism-android/app/build/outputs/apk/release/app-release.apk "dist/github/schism-$VERSION.apk"
          cp schism-android/app/build/outputs/bundle/release/app-release.aab "dist/play/schism-$VERSION.aab"
          tools/release/generate_checksums.sh dist/github

      - name: Destroy signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/schism-release.jks" schism-android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: release-github
          path: dist/github/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-play
          path: dist/play/*
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-github
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -euo pipefail
          # --verify-tag: publish only against a tag that really exists on the remote, so a typo
          # cannot conjure a release from thin air.
          gh release create "$TAG" dist/* \
            --title "Schism $TAG" \
            --verify-tag \
            --notes-file "store/play/en-US/release-notes/$CODE.txt"

  play-upload:
    # Skipped cleanly until the Play service account exists, rather than failing every release
    # until then. Runs after the GitHub release so a Play rejection never leaves users without the
    # APK they were told about.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-play
          path: dist
      - id: guard
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "${SA:-}" ]]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping the Play upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # ⚠ Third-party action, and it is handed a credential that can publish to every user of the
      # app. Pin it to a full commit SHA rather than a tag before relying on it: a moved tag is an
      # unreviewed code change with access to that credential.
      - if: steps.guard.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dkadev.schism
          releaseFiles: dist/*.aab
          # internal, never production: promotion to a wider track stays a human decision in the
          # Console, and the closed-testing gate has to be satisfied before production anyway.
          track: internal
          status: completed
          releaseName: ${{ needs.build.outputs.version }}
