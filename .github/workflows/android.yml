name: Android

on:
  pull_request:
    paths: ["schism-android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["schism-android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schism-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Create ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          ci_key="$RUNNER_TEMP/schism-ci.jks"
          keytool -genkeypair -noprompt -keystore "$ci_key" -storepass ci-password -keypass ci-password -alias ci -keyalg RSA -keysize 4096 -validity 2 -dname "CN=Schism CI"
          {
            echo "storeFile=$ci_key"
            echo "storePassword=ci-password"
            echo "keyAlias=ci"
            echo "keyPassword=ci-password"
          } > keystore.properties
      - name: Unit, lint, and minified release
        run: ./gradlew test :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify release-equivalent package
        run: tools/verify-release-packaging.sh app/build/outputs/apk/release/app-release.apk
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-failure-reports
          path: |
            schism-android/app/build/reports
            schism-android/app/build/test-results
          retention-days: 7

