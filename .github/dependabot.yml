version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      github-actions: { patterns: ["*"] }

  # Two Android groups: the first pattern list wins, so security-sensitive libraries
  # (OCR runtime, storage, network/auth, Play services) land in their own PR and are
  # never merged as part of a bulk bump. See docs/security/dependency-policy.md.
  - package-ecosystem: gradle
    directory: "/schism-android"
    schedule: { interval: weekly }
    groups:
      android-security-sensitive:
        patterns:
          - "com.microsoft.onnxruntime:*"
          - "org.opencv:*"
          - "androidx.room:*"
          - "androidx.datastore:*"
          - "androidx.security:*"
          - "com.squareup.okhttp3:*"
          - "com.squareup.retrofit2:*"
          - "com.google.android.gms:*"
          - "com.google.android.play:*"
      android-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/schism-backend"
    schedule: { interval: weekly }
    groups:
      backend-security-sensitive:
        patterns:
          - "golang.org/x/crypto"
          - "github.com/jackc/*"
          - "github.com/golang-migrate/*"
      backend-dependencies:
        patterns: ["*"]
